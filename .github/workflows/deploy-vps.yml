name: Deploy production API

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lead-trace-api
  WORKER_IMAGE_NAME: ${{ github.repository_owner }}/lead-trace-worker

concurrency:
  group: deploy-api-${{ github.ref_type == 'tag' && 'production' || github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"

  pull_request:
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "packages/db/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - "eslint.config.mjs"
      - "docker-compose.yml"
      - "nginx/**"
      - "apps/api/Dockerfile"
      - "apps/api/docker-entrypoint.sh"
      - ".github/workflows/deploy-vps.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lead-trace?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lead-trace
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lead-trace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24.14.0"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Setup worker
        run: npm run worker:setup

      - name: Generate database client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate

      - name: Lint
        run: npm run lint -- --filter=@lead-trace/api... --filter=@lead-trace/worker

      - name: Check types
        run: npm run check-types -- --filter=@lead-trace/api... --filter=@lead-trace/worker

      - name: Build backend
        run: npm run build -- --filter=@lead-trace/api --filter=@lead-trace/worker

      - name: Run API tests
        working-directory: apps/api
        run: node --test test/*.test.cjs

      - name: Run API integration tests
        working-directory: apps/api
        env:
          INTEGRATION_TESTS: "true"
        run: node --test test/*.integration.test.cjs

      - name: Run worker tests
        run: npm run test -- --filter=@lead-trace/worker

  build-image:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.api-image.outputs.name }}
      worker_image: ${{ steps.worker-image.outputs.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set API image name
        id: api-image
        run: echo "name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set worker image name
        id: worker-image
        run: echo "name=${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.api-image.outputs.name }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: apps/worker
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.worker-image.outputs.name }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  deploy:
    needs: [verify, build-image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v7.0.1

      - name: Upload deployment configuration
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "docker-compose.yml,nginx/templates"
          target: lead-trace

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV_FILE }}
          API_IMAGE: ${{ needs.build-image.outputs.api_image }}
          WORKER_IMAGE: ${{ needs.build-image.outputs.worker_image }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: PRODUCTION_ENV,API_IMAGE,WORKER_IMAGE,GHCR_USERNAME,GHCR_READ_TOKEN
          script: |
            set -e
            umask 077

            cd "$HOME/lead-trace"
            for required in POSTGRES_PASSWORD BETTER_AUTH_SECRET RESEND_API_KEY TAVILY_API_KEY DASHSCOPE_API_KEY; do
              printf '%s\n' "$PRODUCTION_ENV" | grep -Eq "^${required}=.+$" || {
                echo "Missing required production setting: ${required}" >&2
                exit 1
              }
            done
            if printf '%s\n' "$PRODUCTION_ENV" | grep -Eq '^(POSTGRES_PASSWORD=change-me-before-production|BETTER_AUTH_SECRET=replace-)'; then
              echo "Production environment contains placeholder credentials" >&2
              exit 1
            fi
            printf '%s\nAPI_IMAGE=%s\nWORKER_IMAGE=%s\nAPI_RUN_DB_SETUP_ON_STARTUP=false\n' "$PRODUCTION_ENV" "$API_IMAGE" "$WORKER_IMAGE" > .env
            docker compose config --quiet
            test -f nginx/certs/origin.crt
            test -f nginx/certs/origin.key

            if [ -n "$GHCR_READ_TOKEN" ]; then
              printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi
            docker compose pull api worker
            docker compose up -d --no-build --remove-orphans --wait --wait-timeout 120 postgres
            docker compose run --rm --no-deps api migrate
            docker compose up -d --no-build --no-deps --wait --wait-timeout 60 api worker
            docker compose up -d --no-build --force-recreate --remove-orphans --wait --wait-timeout 60 nginx

            test -n "$(docker compose ps -q --status running postgres)"
            test -n "$(docker compose ps -q --status running api)"
            test -n "$(docker compose ps -q --status running worker)"
            test -n "$(docker compose ps -q --status running nginx)"
            docker compose run --rm --no-deps api notify-waitlist-launch --send
            docker image prune -af

            echo "Production API deployment complete"
