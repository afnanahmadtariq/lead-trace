name: Deploy Cloudflare (Frontend)

concurrency:
  group: deploy-web-${{ github.ref_type == 'tag' && 'production' || github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"

  pull_request:
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - "apps/web/wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint --workspace=@lead-trace/web

      - name: Check frontend types
        run: npm run check-types --workspace=@lead-trace/web

      - name: Build frontend for PR validation
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run build --workspace=@lead-trace/web

  build-artifact:
    needs: verify
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate web build input
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          case "$NEXT_PUBLIC_API_URL" in
            https://*) ;;
            *) echo "NEXT_PUBLIC_API_URL must be a non-empty HTTPS URL" >&2; exit 1 ;;
          esac

      - name: Build OpenNext artifact
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NODE_ENV: production
        run: npm run cf:build --workspace=@lead-trace/web

      - name: Validate exact Cloudflare artifact
        working-directory: apps/web
        run: npx wrangler deploy --dry-run

      - name: Upload Cloudflare artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.sha }}
          path: apps/web/.open-next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build-artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: npm

      - name: Install deployment dependencies
        run: npm ci

      - name: Download validated Cloudflare artifact
        uses: actions/download-artifact@v5
        with:
          name: web-${{ github.sha }}
          path: apps/web/.open-next

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy validated artifact to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
