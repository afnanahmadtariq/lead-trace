<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1280 720"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1768C7"/></marker></defs><rect width="1280" height="720" fill="#F7FAFF"/><g font-family="Helvetica Neue,Arial,sans-serif"><text x="64" y="66" font-size="29" font-weight="700" fill="#173B75">Lead Trace</text><image x="1156" y="28" width="60" height="60" href="data:image/svg+xml;base64,"/><text x="64" y="140" font-size="38" font-weight="700" fill="#173B75">Discovery to the next sales action</text><text x="64" y="184" font-size="21" fill="#607DA3">From buyer profile to the next action, with source evidence attached</text><path d="M266 373 L302 373" fill="none" stroke="#1768C7" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M504 373 L540 373" fill="none" stroke="#1768C7" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M742 373 L778 373" fill="none" stroke="#1768C7" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M980 373 L1016 373" fill="none" stroke="#1768C7" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="64" y="280" width="202" height="186" rx="12" fill="white" stroke="#C4DAF5" stroke-width="1.8"/><text x="82" y="317" fill="#1768C7" font-size="22" font-weight="700">01  Discover</text><text x="82" y="357" fill="#173B75" font-size="21">Buyer profile</text><text x="82" y="386" fill="#173B75" font-size="21">and sourced</text><text x="82" y="415" fill="#173B75" font-size="21">companies</text><rect x="302" y="280" width="202" height="186" rx="12" fill="white" stroke="#C4DAF5" stroke-width="1.8"/><text x="320" y="317" fill="#1768C7" font-size="22" font-weight="700">02  Review</text><text x="320" y="357" fill="#173B75" font-size="21">Current role,</text><text x="320" y="386" fill="#173B75" font-size="21">buyer-fit evidence,</text><text x="320" y="415" fill="#173B75" font-size="21">and qualification</text><rect x="540" y="280" width="202" height="186" rx="12" fill="white" stroke="#C4DAF5" stroke-width="1.8"/><text x="558" y="317" fill="#1768C7" font-size="22" font-weight="700">03  Save</text><text x="558" y="357" fill="#173B75" font-size="21">Reviewed lead</text><text x="558" y="386" fill="#173B75" font-size="21">becomes a</text><text x="558" y="415" fill="#173B75" font-size="21">CRM contact</text><rect x="778" y="280" width="202" height="186" rx="12" fill="white" stroke="#C4DAF5" stroke-width="1.8"/><text x="796" y="317" fill="#1768C7" font-size="22" font-weight="700">04  Prepare</text><text x="796" y="357" fill="#173B75" font-size="21">Offer context</text><text x="796" y="386" fill="#173B75" font-size="21">and a cited</text><text x="796" y="415" fill="#173B75" font-size="21">conversation brief</text><rect x="1016" y="280" width="202" height="186" rx="12" fill="white" stroke="#C4DAF5" stroke-width="1.8"/><text x="1034" y="317" fill="#1768C7" font-size="22" font-weight="700">05  Act</text><text x="1034" y="357" fill="#173B75" font-size="21">Deal, note,</text><text x="1034" y="386" fill="#173B75" font-size="21">follow-up, or</text><text x="1034" y="415" fill="#173B75" font-size="21">Calendar meeting</text><text x="64" y="668" fill="#1768C7" font-size="22" font-weight="700">Evidence stays attached when a reviewed lead becomes a CRM contact.</text><text x="64" y="703" fill="#607DA3" font-size="15">leadtrace.online</text></g></svg>